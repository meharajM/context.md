 <text x="130" y="84" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2.5" fill="#2B4148">THOUGHT NOTES</text>
 <text x="70" y="230" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.2" fill="#263B42">Speak freely.</text>
 <text x="70" y="310" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.2" fill="#263B42">Stay in your flow.</text>
 <text x="72" y="374" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#455B61">Recording continues as you switch apps.</text>
 <text x="72" y="412" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#455B61">Stop from your widget or notification.</text>
 <rect x="120" y="455" width="840" height="54" rx="27" fill="#E4EAE6"/><circle cx="158" cy="482" r="7" fill="#C85B4C"/>
 <text x="552" y="491" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing=".8" fill="#384D48">TAP TO START  ·  STOP WHEN READY</text>
 <rect x="70" y="580" width="940" height="504" rx="42" fill="#FEFDFC" filter="url(#shadow)"/>
 <image xlink:href="recording-stop-notification-card.jpg" href="recording-stop-notification-card.jpg" x="88" y="598" width="904" height="468" preserveAspectRatio="none" clip-path="url(#notice)"/>
 <text x="540" y="1210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#2B4148">Your voice. Transcribed on-device.</text>
 <text x="540" y="1260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="29" fill="#455B61">English speech becomes a note you can revisit.</text>
