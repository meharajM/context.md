 </defs>
 <rect width="1080" height="1920" fill="url(#bg)"/>
 <circle cx="1030" cy="80" r="300" fill="#D9E5E0" opacity=".52"/><circle cx="30" cy="1870" r="260" fill="#E8DFC9" opacity=".55"/>
 <path d="M0 500C220 420 410 505 580 445s320-120 500-45" fill="none" stroke="#D1DDD8" stroke-width="2" opacity=".8"/>
